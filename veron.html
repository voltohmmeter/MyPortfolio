<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #000000 0%, #000000 100%);
            font-family: Arial, sans-serif;
        }

        .loading-container {
            text-align: center;
            color: white;
        }

        /* Option 1: Spinner Animation */
        .loader {
            width: 80px;
            height: 80px;
            border: 8px solid rgba(255, 255, 255, 0.3);
            border-top: 8px solid white;
            border-radius: 50%;
            margin: 0 auto 30px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Option 2: If you want to use a GIF instead */
        .loader-gif {
            width: 300px;
            /* adjust to your preferred size */
            height: 300px;
            margin: 0 auto 30px;
            border-radius: 50%;
            /* makes the container circular */
            overflow: hidden;
            /* hides the corners of the rectangular gif */
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #00ffff;
            /* neon cyan border */
            box-shadow:
                0 0 10px #00ffff,
                0 0 20px #00ffff,
                0 0 40px #00ffff,
                0 0 80px #00ffff;
            /* optional: adds a circular border */
        }

        .loading-text {
            font-size: 24px;
            font-weight: bold;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .dots {
            display: inline-block;
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {

            0%,
            20% {
                content: '';
            }

            40% {
                content: '.';
            }

            60% {
                content: '..';
            }

            80%,
            100% {
                content: '...';
            }
        }
    </style>
</head>

<body>
    <div class="loading-container">
        <!-- Option 1: CSS Spinner -->
        <!-- <div class="loader"></div> -->

        <!-- Option 2: Use GIF instead (uncomment below and comment out the .loader div above) -->
        <div class="loader-gif">
            <img src="assets/images/nica2.gif" alt="Loading..." style="width: 100%; height: 100%; object-fit: cover;">
        </div>

        <div class="loading-text">
            Loading<span class="dots"></span>
        </div>
    </div>

    <script>
        // Automatically redirect to main page after 2 seconds
        setTimeout(function () {
            window.location.href = 'main.html'; // Change to your main page
        }, 5000); // 2000 milliseconds = 2 seconds
    </script>
</body>

</html>
